name: Build Mod
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          RELEASE_MODE=${{False}} \
          ./gradlew build

      - name: Publish Mod
        run: ./gradlew publish
        env:
          DEVOS_USERNAME: ${{ secrets.DEVOS_USER }}
          DEVOS_PASSWORD: ${{ secrets.DEVOS_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
            common/build/libs/
